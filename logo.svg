<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Grid view, half grid and half list">
    <defs>
        <clipPath id="tile">
            <circle cx="256" cy="256" r="256"/>
        </clipPath>
        <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#7B79FF"/>
            <stop offset="1" stop-color="#3A36F5"/>
        </linearGradient>
        <!-- Tinted at the rim, white towards the divide, so the circle keeps an edge on a white
             page while the two halves still part cleanly down the middle. -->
        <linearGradient id="pale" x1="1" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="#E2E1FF"/>
            <stop offset="1" stop-color="#FFFFFF"/>
        </linearGradient>
    </defs>

    <!-- The tile is a circle rather than a rounded square, and the two halves are parted by an
         S-curve rather than a straight diagonal. Both ends of the curve still meet the circle on
         the old corner-to-corner line, so the halves read the same way round as before. The pale
         half overshoots the circle and is cut back by the clip, so the two fills meet the rim as
         one edge instead of leaving a half-covered violet seam along it. -->
    <g clip-path="url(#tile)">
        <rect width="512" height="512" fill="url(#violet)"/>
        <path d="M437 75 C366 244 146 268 75 437 L-60 602 L602 602 L602 -60 Z" fill="url(#pale)"/>

        <!-- Grid: four rounded tiles on the violet half. List: three rounded bars on the pale
             half. Each sits at the visual centre of its own half, clear of the curve's bulge. -->
        <g fill="#FFFFFF">
            <rect x="100" y="100" width="58" height="58" rx="18"/>
            <rect x="172" y="100" width="58" height="58" rx="18"/>
            <rect x="100" y="172" width="58" height="58" rx="18"/>
            <rect x="172" y="172" width="58" height="58" rx="18"/>
        </g>
        <g fill="#4945FF">
            <rect x="282" y="282" width="130" height="26" rx="13"/>
            <rect x="282" y="334" width="130" height="26" rx="13"/>
            <rect x="282" y="386" width="130" height="26" rx="13"/>
        </g>
    </g>
</svg>
